# Production Supabase Configuration
# This file contains production-specific settings for Supabase

project_id = "ascend-authentication-prod"

[api]
enabled = true
# Production API configuration
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Reduced max_rows for production security
max_rows = 500

[db]
# Production database configuration
major_version = 15
# Enable connection pooling for production
pool_size = 15
pool_timeout = 10

[studio]
enabled = false  # Disable Studio in production for security

[storage]
enabled = true
# Production file size limits
file_size_limit = "10MiB"

[auth]
enabled = true
# Production auth configuration
site_url = "https://your-production-domain.com"
additional_redirect_urls = [
  "https://your-production-domain.com",
  "https://your-production-domain.com/auth/callback"
]
# Extended JWT expiry for production (24 hours)
jwt_expiry = 86400
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Disable signup in production (controlled registration only)
enable_signup = false

[auth.email]
# Production email configuration
enable_signup = false  # Controlled via college verification
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
# Disable SMS in production (email verification only)
enable_signup = false
enable_confirmations = false

# Production OAuth providers (configure as needed)
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "https://your-production-domain.com/auth/callback/google"

[auth.external.github]
enabled = true
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_CLIENT_SECRET)"
redirect_uri = "https://your-production-domain.com/auth/callback/github"

[edge_functions]
enabled = true
# Use per_worker for production performance
request_policy = "per_worker"

[analytics]
enabled = true
backend = "postgres"